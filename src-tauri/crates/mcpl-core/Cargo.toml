[package]
name = "mcpl-core"
version = "0.1.0"
description = "Client configs, sync and licensing shared by MCP Linker and the mcpl CLI"
authors = ["milisp"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/milisp/mcp-linker"

[features]
# Marks the commands with #[tauri::command] for the desktop app.
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
dirs = "6.0.0"
tokio = { version = "1.45.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
url = "2.5.4"
tempfile = "3.8"
ring = "0.17.8"
chrono = { version = "0.4.41", features = ["serde", "clock"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
log = "0.4.27"
once_cell = "1.21.3"
toml = "0.9.5"
toml_edit = "0.23.7"
