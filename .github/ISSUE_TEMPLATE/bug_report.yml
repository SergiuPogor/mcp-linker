name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened. Screenshots or logs help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MCP Linker version
      description: Shown on the About page.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client involved
      description: Claude Code, Codex, Cursor, etc. Leave blank if not client-specific.
